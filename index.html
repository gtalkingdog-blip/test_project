<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비밀번호 생성기</title>
<meta name="description" content="길이, 문자 유형, 혼동 문자 제외 옵션을 지정해 안전한 비밀번호와 패스프레이즈를 만드는 도구">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">

  <header class="head">
    <h1>비밀번호 생성기</h1>
    <p class="sub">브라우저 안에서만 만들어지며 어디에도 전송되지 않습니다.</p>
  </header>

  <section class="card result-card" aria-labelledby="result-label">
    <h2 id="result-label" class="sr-only">생성 결과</h2>
    <output id="result" class="result" role="status" aria-live="polite">여기에 비밀번호가 표시됩니다</output>
    <div class="result-actions">
      <button type="button" id="copyBtn" class="btn btn-ghost">복사하기</button>
      <button type="button" id="genBtn" class="btn btn-primary">새로 만들기</button>
    </div>
    <p id="warning" class="warning" hidden></p>
  </section>

  <section class="card">
    <div class="field">
      <div class="field-head">
        <label for="length">길이</label>
        <span id="lengthValue" class="pill">16자</span>
      </div>
      <input type="range" id="length" min="8" max="32" value="16" step="1">
      <div class="scale"><span>8</span><span>32</span></div>
      <p id="lengthHint" class="hint" hidden></p>
    </div>

    <div class="field">
      <span class="field-head" id="mode-label">생성 방식</span>
      <div class="segmented" role="radiogroup" aria-labelledby="mode-label">
        <input type="radio" name="mode" id="modeRandom" value="random" checked>
        <label for="modeRandom">무작위 문자열</label>
        <input type="radio" name="mode" id="modePhrase" value="passphrase">
        <label for="modePhrase">단어 조합</label>
      </div>
    </div>

    <div class="field">
      <span class="field-head" id="types-label">포함할 문자</span>
      <div class="checks" role="group" aria-labelledby="types-label">
        <label class="check"><input type="checkbox" id="useUpper" checked><span>대문자 <em>A-Z</em></span></label>
        <label class="check"><input type="checkbox" id="useLower" checked><span>소문자 <em>a-z</em></span></label>
        <label class="check"><input type="checkbox" id="useNumber" checked><span>숫자 <em>0-9</em></span></label>
        <label class="check"><input type="checkbox" id="useSymbol" checked><span>특수문자 <em>!@#$</em></span></label>
      </div>
    </div>

    <div class="field field-last">
      <label class="check check-wide">
        <input type="checkbox" id="excludeAmbiguous">
        <span>헷갈리는 문자 제외 <em id="ambiguousList"></em></span>
      </label>
    </div>
  </section>

</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="script.js" defer></script>
</body>
</html>
