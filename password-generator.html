<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비밀번호 생성기</title>
<meta name="description" content="길이, 문자 유형, 혼동 문자 제외 옵션을 지정해 안전한 비밀번호와 패스프레이즈를 만드는 도구">
<style>
:root {
  --bg: #f1f3f6;
  --card: #ffffff;
  --ink: #1b2027;
  --ink-soft: #5e6b7a;
  --line: #e1e6ec;
  --accent: #4a63d8;
  --accent-ink: #ffffff;
  --accent-soft: #eef1fd;
  --warn: #b64527;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 8px 24px rgba(20, 30, 50, .07);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
          "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c;
    --card: #182029;
    --ink: #e7ecf2;
    --ink-soft: #94a2b3;
    --line: #29333f;
    --accent: #7d92f0;
    --accent-ink: #10151c;
    --accent-soft: #1f2838;
    --warn: #e08a68;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3);
  }
}

:root[data-theme="dark"] {
  --bg: #10151c;
  --card: #182029;
  --ink: #e7ecf2;
  --ink-soft: #94a2b3;
  --line: #29333f;
  --accent: #7d92f0;
  --accent-ink: #10151c;
  --accent-soft: #1f2838;
  --warn: #e08a68;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 28px 16px calc(64px + env(safe-area-inset-bottom, 0px));
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- header ---------- */
.head { margin-bottom: 18px; }
.head h1 {
  margin: 0;
  font-size: clamp(1.4rem, 5vw, 1.75rem);
  letter-spacing: -.02em;
}
.sub {
  margin: 6px 0 0;
  color: var(--ink-soft);
  font-size: .875rem;
}

/* ---------- card ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 16px;
  margin-bottom: 16px;
}

/* ---------- result ---------- */
.result {
  display: block;
  width: 100%;
  min-height: 76px;
  padding: 16px 14px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--ink);
  font-family: var(--mono);
  font-size: clamp(1rem, 4.2vw, 1.25rem);
  line-height: 1.45;
  letter-spacing: .02em;
  word-break: break-all;
  overflow-wrap: anywhere;
  user-select: all;
}
.result.is-placeholder {
  color: var(--ink-soft);
  font-family: var(--sans);
  letter-spacing: normal;
  user-select: none;
}

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.btn {
  flex: 1 1 0;
  min-height: 48px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--ink);
  transition: transform .06s ease, opacity .15s ease, background-color .15s ease;
}
.btn:hover { background: var(--accent-soft); }
.btn:active { transform: scale(.985); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover { background: var(--accent); opacity: .9; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

.warning {
  margin: 12px 0 0;
  color: var(--warn);
  font-size: .85rem;
}

/* ---------- fields ---------- */
.field {
  padding-bottom: 18px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.field-last, .field:last-child {
  padding-bottom: 0;
  margin-bottom: 0;
  border-bottom: 0;
}
.field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
  font-weight: 600;
  font-size: .95rem;
}
.pill {
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  font-size: .85rem;
}
.hint {
  margin: 10px 0 0;
  color: var(--ink-soft);
  font-size: .8rem;
}
.scale {
  display: flex;
  justify-content: space-between;
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: .75rem;
}

/* ---------- range ---------- */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px; height: 24px;
  margin-top: -9px;
  border: 3px solid var(--card);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
}
input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
}
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px;
  border: 3px solid var(--card);
  border-radius: 50%;
  background: var(--accent);
}

/* ---------- segmented ---------- */
.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 5px;
  border-radius: 12px;
  background: var(--bg);
  border: 1px solid var(--line);
}
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 0 8px;
  border-radius: 8px;
  color: var(--ink-soft);
  font-size: .9rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease;
}
.segmented input:checked + label {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(20, 30, 50, .14);
}
.segmented input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- checkboxes ---------- */
.checks {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}
.check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  font-size: .9rem;
  transition: border-color .15s ease, background-color .15s ease;
}
.check:hover { background: var(--accent-soft); }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.check:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.check input {
  width: 18px; height: 18px;
  flex: none;
  accent-color: var(--accent);
  cursor: pointer;
}
.check em {
  display: block;
  color: var(--ink-soft);
  font-style: normal;
  font-size: .75rem;
  font-family: var(--mono);
  word-break: break-all;
}
.check-wide { min-height: 52px; }

/* ---------- toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 10;
  max-width: calc(100vw - 32px);
  padding: 12px 20px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font-size: .9rem;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 12px);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
}
.toast.is-visible {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}
.toast.is-error { background: var(--warn); color: #fff; }

@media (min-width: 600px) {
  .wrap { padding-top: 48px; }
  .card { padding: 22px 20px; }
  .result-actions .btn { flex: 0 1 auto; min-width: 140px; }
  .result-actions { justify-content: flex-end; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="wrap">

  <header class="head">
    <h1>비밀번호 생성기</h1>
    <p class="sub">브라우저 안에서만 만들어지며 어디에도 전송되지 않습니다.</p>
  </header>

  <section class="card result-card" aria-labelledby="result-label">
    <h2 id="result-label" class="sr-only">생성 결과</h2>
    <output id="result" class="result" role="status" aria-live="polite">여기에 비밀번호가 표시됩니다</output>
    <div class="result-actions">
      <button type="button" id="copyBtn" class="btn btn-ghost">복사하기</button>
      <button type="button" id="genBtn" class="btn btn-primary">새로 만들기</button>
    </div>
    <p id="warning" class="warning" hidden></p>
  </section>

  <section class="card">
    <div class="field">
      <div class="field-head">
        <label for="length">길이</label>
        <span id="lengthValue" class="pill">16자</span>
      </div>
      <input type="range" id="length" min="8" max="32" value="16" step="1">
      <div class="scale"><span>8</span><span>32</span></div>
      <p id="lengthHint" class="hint" hidden></p>
    </div>

    <div class="field">
      <span class="field-head" id="mode-label">생성 방식</span>
      <div class="segmented" role="radiogroup" aria-labelledby="mode-label">
        <input type="radio" name="mode" id="modeRandom" value="random" checked>
        <label for="modeRandom">무작위 문자열</label>
        <input type="radio" name="mode" id="modePhrase" value="passphrase">
        <label for="modePhrase">단어 조합</label>
      </div>
    </div>

    <div class="field">
      <span class="field-head" id="types-label">포함할 문자</span>
      <div class="checks" role="group" aria-labelledby="types-label">
        <label class="check"><input type="checkbox" id="useUpper" checked><span>대문자 <em>A-Z</em></span></label>
        <label class="check"><input type="checkbox" id="useLower" checked><span>소문자 <em>a-z</em></span></label>
        <label class="check"><input type="checkbox" id="useNumber" checked><span>숫자 <em>0-9</em></span></label>
        <label class="check"><input type="checkbox" id="useSymbol" checked><span>특수문자 <em>!@#$</em></span></label>
      </div>
    </div>

    <div class="field field-last">
      <label class="check check-wide">
        <input type="checkbox" id="excludeAmbiguous">
        <span>헷갈리는 문자 제외 <em id="ambiguousList"></em></span>
      </label>
    </div>
  </section>

</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ---------- 문자 집합 ---------- */
  var CHARSETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    number: '0123456789',
    symbol: '!@#$%^&*()-_=+[]{};:,.?/~'
  };

  // 시각적으로 혼동하기 쉬운 문자들
  var AMBIGUOUS = 'O0oIl1LS5Z2B8';

  // 패스프레이즈용 짧은 영단어 50개
  var WORDS = [
    'apple', 'beach', 'bird', 'blue', 'boat', 'book', 'bread', 'cake', 'cat', 'chair',
    'cloud', 'coin', 'cook', 'corn', 'desk', 'dog', 'door', 'duck', 'farm', 'fire',
    'fish', 'flag', 'frog', 'game', 'gold', 'green', 'hand', 'hat', 'house', 'ice',
    'king', 'lamp', 'leaf', 'lion', 'milk', 'moon', 'nest', 'nose', 'pen', 'pink',
    'rain', 'river', 'road', 'rock', 'salt', 'ship', 'snow', 'star', 'tree', 'wind'
  ];

  /* ---------- DOM ---------- */
  var el = {
    result: document.getElementById('result'),
    warning: document.getElementById('warning'),
    copyBtn: document.getElementById('copyBtn'),
    genBtn: document.getElementById('genBtn'),
    length: document.getElementById('length'),
    lengthValue: document.getElementById('lengthValue'),
    lengthHint: document.getElementById('lengthHint'),
    upper: document.getElementById('useUpper'),
    lower: document.getElementById('useLower'),
    number: document.getElementById('useNumber'),
    symbol: document.getElementById('useSymbol'),
    exclude: document.getElementById('excludeAmbiguous'),
    ambiguousList: document.getElementById('ambiguousList'),
    modeRandom: document.getElementById('modeRandom'),
    modePhrase: document.getElementById('modePhrase'),
    toast: document.getElementById('toast')
  };

  /* ---------- 난수 유틸 (모듈로 편향 제거) ---------- */
  var RANGE = 4294967296; // 2^32

  function randomInt(max) {
    if (max <= 0) { throw new Error('max must be positive'); }
    var limit = Math.floor(RANGE / max) * max;
    var buf = new Uint32Array(1);
    var value;
    do {
      crypto.getRandomValues(buf);
      value = buf[0];
    } while (value >= limit);
    return value % max;
  }

  function pick(source) {
    return source[randomInt(source.length)];
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randomInt(i + 1);
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  /* ---------- 옵션 읽기 ---------- */
  function readOptions() {
    return {
      length: parseInt(el.length.value, 10),
      mode: el.modePhrase.checked ? 'passphrase' : 'random',
      upper: el.upper.checked,
      lower: el.lower.checked,
      number: el.number.checked,
      symbol: el.symbol.checked,
      exclude: el.exclude.checked
    };
  }

  function filterAmbiguous(chars, exclude) {
    if (!exclude) { return chars; }
    return chars.split('').filter(function (c) {
      return AMBIGUOUS.indexOf(c) === -1;
    }).join('');
  }

  function activePools(opts) {
    var pools = [];
    ['upper', 'lower', 'number', 'symbol'].forEach(function (key) {
      if (!opts[key]) { return; }
      var chars = filterAmbiguous(CHARSETS[key], opts.exclude);
      if (chars.length > 0) { pools.push(chars); }
    });
    return pools;
  }

  /* ---------- 무작위 문자열 모드 ---------- */
  function generateRandom(opts) {
    var pools = activePools(opts);
    var chars = [];
    var i;

    // 선택한 유형이 최소 1자씩 반드시 포함되도록 먼저 채운다
    for (i = 0; i < pools.length; i++) {
      chars.push(pick(pools[i]));
    }

    var all = pools.join('');
    for (i = chars.length; i < opts.length; i++) {
      chars.push(pick(all));
    }

    return shuffle(chars).join('');
  }

  /* ---------- 패스프레이즈 모드 ---------- */
  // 길이 슬라이더 값을 단어 개수로 환산 (8~32자 -> 3~6단어)
  function wordCountFor(length) {
    if (length <= 13) { return 3; }
    if (length <= 19) { return 4; }
    if (length <= 25) { return 5; }
    return 6;
  }

  function styleWord(word, opts) {
    if (opts.upper && opts.lower) {
      return word.charAt(0).toUpperCase() + word.slice(1);
    }
    if (opts.upper) { return word.toUpperCase(); }
    return word;
  }

  function generatePassphrase(opts) {
    var count = wordCountFor(opts.length);
    var pool = WORDS.slice();
    var chosen = [];

    // 같은 단어가 중복되지 않도록 비복원 추출
    for (var i = 0; i < count; i++) {
      var index = randomInt(pool.length);
      chosen.push(styleWord(pool[index], opts));
      pool.splice(index, 1);
    }

    var separators = filterAmbiguous('-_!@#$%&*+=', opts.exclude);
    var separator = opts.symbol && separators.length > 0 ? pick(separators) : '-';
    var phrase = chosen.join(separator);

    if (opts.number) {
      var digits = filterAmbiguous(CHARSETS.number, opts.exclude);
      if (digits.length > 0) {
        phrase += separator + pick(digits) + pick(digits);
      }
    }

    return phrase;
  }

  /* ---------- 유효성 검사 ---------- */
  function validate(opts) {
    if (opts.mode === 'passphrase') {
      if (!opts.upper && !opts.lower) {
        return '단어 조합 모드는 대문자 또는 소문자 중 하나 이상을 선택해야 합니다.';
      }
      return null;
    }
    if (activePools(opts).length === 0) {
      return '포함할 문자를 한 가지 이상 선택해 주세요.';
    }
    return null;
  }

  /* ---------- 화면 갱신 ---------- */
  function setResult(text, isPlaceholder) {
    el.result.textContent = text;
    el.result.classList.toggle('is-placeholder', !!isPlaceholder);
  }

  function generate() {
    var opts = readOptions();
    var error = validate(opts);

    el.warning.hidden = !error;
    el.warning.textContent = error || '';
    el.genBtn.disabled = !!error;
    el.copyBtn.disabled = !!error;

    if (error) {
      setResult('설정을 확인해 주세요', true);
      return;
    }

    setResult(opts.mode === 'passphrase' ? generatePassphrase(opts) : generateRandom(opts), false);
  }

  function syncLabels() {
    var opts = readOptions();
    el.lengthValue.textContent = opts.length + '자';

    var isPhrase = opts.mode === 'passphrase';
    el.lengthHint.hidden = !isPhrase;
    if (isPhrase) {
      el.lengthHint.textContent =
        '단어 조합 모드에서는 길이에 맞춰 단어 ' + wordCountFor(opts.length) + '개를 사용합니다. ' +
        '단어 자체는 읽기 쉬우므로 헷갈리는 문자 제외 옵션은 숫자와 구분 기호에만 적용됩니다.';
    }
  }

  /* ---------- 토스트 ---------- */
  var toastTimer = null;

  function showToast(message, isError) {
    el.toast.textContent = message;
    el.toast.classList.toggle('is-error', !!isError);
    el.toast.classList.add('is-visible');

    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () {
      el.toast.classList.remove('is-visible');
      toastTimer = null;
    }, 2000);
  }

  /* ---------- 클립보드 복사 ---------- */
  function legacyCopy(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.top = '-1000px';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, text.length);

    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(area);
    return ok;
  }

  function copyResult() {
    var text = el.result.textContent;
    if (!text || el.result.classList.contains('is-placeholder')) { return; }

    function fallback() {
      if (legacyCopy(text)) {
        showToast('복사되었습니다', false);
      } else {
        showToast('복사에 실패했습니다. 직접 선택해 복사해 주세요', true);
      }
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('복사되었습니다', false);
      }).catch(fallback);
      return;
    }

    fallback();
  }

  /* ---------- 초기화 ---------- */
  el.ambiguousList.textContent = AMBIGUOUS.split('').join(' ');

  el.genBtn.addEventListener('click', generate);
  el.copyBtn.addEventListener('click', copyResult);

  el.length.addEventListener('input', function () {
    syncLabels();
    generate();
  });

  [el.upper, el.lower, el.number, el.symbol, el.exclude, el.modeRandom, el.modePhrase]
    .forEach(function (input) {
      input.addEventListener('change', function () {
        syncLabels();
        generate();
      });
    });

  syncLabels();
  generate();
})();
</script>
</body>
</html>
